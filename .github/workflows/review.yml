name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write        # required to create the fix branch and commit files

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install requests ruff bandit radon pytest pytest-cov sqlfluff yamllint

      - name: Install system tools (shellcheck, hadolint)
        run: |
          sudo apt-get install -y shellcheck
          wget -qO /usr/local/bin/hadolint https://github.com/hadolint/hadolint/releases/latest/download/hadolint-Linux-x86_64
          chmod +x /usr/local/bin/hadolint

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama server
        run: |
          ollama serve &
          for i in $(seq 1 15); do
            curl -sf http://localhost:11434/api/tags > /dev/null && echo "Ollama up" && break
            echo "Waiting for Ollama ($i/15)..."
            sleep 3
          done

      - name: Pull model
        run: |
          ollama pull qwen2.5-coder:1.5b
          echo "Model pull complete"

      - name: Run AI review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # ── Optional overrides ─────────────────────────────────────────────
          # OLLAMA_MODEL: "qwen2.5-coder:7b"
          # MAX_FILES_TO_FIX: "5"
          # MAX_LINES_TO_FIX: "300"
          # MAX_FINDINGS_PER_REVIEW: "3"
        run: python .github/scripts/review_agent.py